name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I am running a supported herdr version (see README → Requirements)
        - label: "I installed the Zed CLI via Zed's command palette (`cli: install cli binary`) or it is already on PATH"
        - label: I searched existing issues for this problem
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact error message from the action or from `herdr plugin log list --plugin open-in-zed`.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `herdr ...`
        2. Press ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - OS:
        - herdr --version:
        - zed --version:
        - Invocation method:
    validations:
      required: true
