# Manifest reference: https://herdr.dev/docs/plugins/
id = "open-in-zed"
name = "Open in Zed"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Opens the current herdr workspace in the Zed editor"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "open"
title = "Open in Zed"
description = "Opens the workspace directory in a new Zed window"
contexts = ["workspace"]
command = ["./target/release/herdr-open-in-zed"]
